# Agent Configuration
# 맥미니에서 관리할 에이전트들을 정의합니다.
# 실제 환경에 맞게 수정하세요.

master:
  name: "Master Agent"
  description: "모든 서브 에이전트를 관리하는 마스터 에이전트"
  script: "~/agents/master_agent.py"
  working_dir: "~/agents"
  python: "python3"
  auto_start: true
  is_master: true
  env:
    AGENT_ROLE: "master"

